<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="https://wow-tw-202601.github.io/wow_image/WoW_icon.ico">
    <meta property="og:title" content="Solo 單排信件投訴整理">
    <meta property="og:description" content="單排異常局、投訴信整理">
    <meta property="og:image" content="https://p2.bahamut.com.tw/S/ACG/c/56/0000005656.JPG">
    <meta property="og:type" content="website">


    <title>魔獸 - Solo Shuffle 信件投訴整理</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f5f7fa; color: #243044; font-family: "Microsoft JhengHei", sans-serif; }
        main { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 26px; }
        .character-form { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
        .character-form input, .character-form select { min-width: 0; padding: 10px 12px; border: 1px solid #d8dee8; border-radius: 6px; font: inherit; }
        .character-form input { width: 250px; max-width: 250px; }
        .character-form select { max-width: 160px; }
        .character-form button { flex-shrink: 0; background: #218838; }
        .character-form input:focus-visible, .character-form select:focus-visible { outline: 2px solid #1769d2; outline-offset: 2px; }
        #characterSaveStatus { color: #b42318; }
        .report-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
        #status { line-height: 1.7; margin: 0; }
        #playerSearch { width: 260px; max-width: 100%; padding: 10px 12px; border: 1px solid #d8dee8; border-radius: 6px; font: inherit; }
        #playerSearch:focus-visible { outline: 2px solid #1769d2; outline-offset: 2px; }
        #status.error { color: #b42318; }
        details { margin: 16px 0; border: 1px solid #d8dee8; border-radius: 10px; background: white; overflow: hidden; }
        summary { display: flex; align-items: center; gap: 12px; padding: 18px 20px; font-weight: bold; cursor: pointer; overflow-wrap: anywhere; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        summary::before { content: ""; flex-shrink: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 7px solid #243044; }
        details[open] summary::before { transform: rotate(90deg); }
        .summary-text { flex: 1; min-width: 0; }
        .high-round-chip { margin-left: auto; flex-shrink: 0; padding: 3px 8px; border-radius: 5px; background: #b42318; color: white; font-size: 15px; line-height: 1.5; white-space: nowrap; }
        .extreme-round-chip { background: #7b1fa2; }
        .summary-tags { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }
        .summary-tags .high-round-chip { margin-left: 0; }
        .early-morning-chip { background: #1769d2; }
        .many-players-chip { background: #cd7213; color: white; }
        summary:hover { background: #edf3fc; }
        summary:focus-visible, button:focus-visible { outline: 2px solid #1769d2; outline-offset: -2px; }
        details[open] summary { border-bottom: 1px solid #d8dee8; }
        .email { padding: 20px; }
        .report-image { display: block; max-width: 100%; height: auto; margin-top: 24px; }
        h2 { margin: 24px 0 10px; font-size: 18px; }
        h2:first-child { margin-top: 0; }
        pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 15px/1.8 Consolas, "Microsoft JhengHei", sans-serif; }
        button { padding: 10px 18px; border: 0; border-radius: 6px; background: #1769d2; color: white; font: inherit; cursor: pointer; }
        .email > button { margin: 0 8px 8px 0; }
        .participation-hint { color: #e67e22; }
        button:disabled { opacity: .6; cursor: wait; }
        @media (max-width: 600px) { main { margin: 24px auto; padding: 0 12px; } summary, .email { padding: 16px; } }
    </style>
</head>
<body>
    <main>
        <h1>
       魔獸世界 Solo Shuffle 信件投訴整理
       <img style="width: 48px;" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/archive/e/eb/20171015201103%21WoW_icon.svg/120px-WoW_icon.svg.png?utm_source=no.wikipedia.org&utm_campaign=index&utm_content=thumbnail">
      
    
    </h1>
        <div>
            本頁面收錄單排可能異常爬分的場次紀錄 (資料來源check pvp 三小時一次紀錄)
        </div>
        <div>
           點擊每個區塊可以展開內容。並且附上投訴信文案 (並提供按鈕 可連接Gmail、outlook寄信)
        </div>
         <div>
           若你也覺得某幾個場次紀錄怪怪的。可寄信請求BZ調查 👍👍
        </div>

        <h3>⚠️寄信只是請求官方調查。是否違規、是由官方去做認定 (不用擔心舉報錯路人)</h3>
        <h3>⚠️嫌太多很麻煩，也可以挑幾個場次比較高的時段投訴</h3>

        <form id="characterForm" class="character-form">
            <input id="characterName" type="text" placeholder="輸入你角色名，第一人稱視角投訴" >
            <select id="characterRealm" aria-label="選擇伺服器">
                <option value="">選擇伺服器</option>
            </select>
            <button type="submit">SAVE (修改完記得按)</button>
        </form>
        <p id="characterSaveStatus" role="status" aria-live="polite" hidden></p>
        <div class="report-toolbar">
            <p id="status" role="status" aria-live="polite">正在載入資料…</p>
            <input id="playerSearch" type="search" placeholder="搜尋玩家名稱或伺服器" aria-label="搜尋 ReportPlayers" disabled>
        </div>
        <button id="retry" type="button" hidden>重新載入</button>
        <section id="reports" aria-label="檢舉信件列表" aria-busy="true"></section>
    </main>
    <script>
        const dataUrl = "https://wow-tw-202601.github.io/wow_image/eachDayEmailSection.txt";
        const status = document.getElementById("status");
        const reports = document.getElementById("reports");
        const retry = document.getElementById("retry");
        const playerSearch = document.getElementById("playerSearch");
        const reportEntries = [];
        playerSearch.addEventListener("input", filterReports);

        function filterReports() {
            const keyword = playerSearch.value.trim().toLowerCase();
            let matchedCount = 0;
            reportEntries.forEach(function (entry) {
                const matches = entry.players.includes(keyword);
                entry.accordion.hidden = !matches;
                if (matches) {
                    matchedCount++;
                }
            });
            if (keyword) {
                status.textContent = "共 " + reportEntries.length + " 筆資料，搜尋命中 " + matchedCount + " 筆。" +
                    (matchedCount ? "點選標題展開信件。" : "沒有符合的玩家資料。");
            } else {
                status.textContent = reportEntries.length ? "共 " + reportEntries.length + " 筆資料，點選標題展開信件。" : "目前沒有資料。";
            }
        }
        const realmCodeMap = {
            '憤怒使者': 'wrathbringer',
            '暗影之月': 'shadowmoon',
            '銀翼要塞': 'silverwing-hold',
            '日落沼澤': 'sundown-marsh',
            '巨龍之喉': 'dragonmaw',
            '阿薩斯': 'arthas',
            '血之谷': 'bleeding-hollow',
            '冰風崗哨': 'chillwind-point',
            '水晶之刺': 'crystalpine-stinger',
            '屠魔山谷': 'demon-fall-canyon',
            '狂熱之刃': 'zealot-blade',
            '克羅之刃': 'krol-blade',
            '老馬布蘭契': 'old-blanchy',
            '地獄吼': 'hellscream',
            '寒冰皇冠': 'icecrown',
            '冰霜之刺': 'frostmane',
            '米奈希爾': 'menethil',
            '尖石': 'spirestone',
            '雷鱗': 'stormscale',
            '夜空之歌': 'nightsong',
            '亞雷戈斯': 'arygos',
            '眾星之子': 'queldorei',
            '語風': 'whisperwind',
            '世界之樹': 'world-tree',
            '雲蛟衛': 'order-of-the-cloud-serpent',
            '天空之牆': 'skywall',
            '聖光之願': 'lights-hope'
        };
        const characterInput = document.getElementById("characterName");
        const realmSelect = document.getElementById("characterRealm");
        const characterSaveStatus = document.getElementById("characterSaveStatus");
        const characterCookieName = "soloShuffleCharacterName";
        const realmCookieName = "soloShuffleCharacterRealm";
        const savedCharacterName = readCookie(characterCookieName);
        const realmCookieValue = readCookie(realmCookieName);
        const savedRealmCode = Object.values(realmCodeMap).includes(realmCookieValue) ? realmCookieValue : "";
        characterInput.value = savedCharacterName;
        Object.entries(realmCodeMap).forEach(function (entry) {
            const option = document.createElement("option");
            option.textContent = entry[0];
            option.value = entry[1];
            realmSelect.append(option);
        });
        realmSelect.value = savedRealmCode;

        function readCookie(name) {
            const prefix = name + "=";
            const cookie = document.cookie.split(";").map(function (value) {
                return value.trim();
            }).find(function (value) {
                return value.startsWith(prefix);
            });
            if (!cookie) {
                return "";
            }
            try {
                return decodeURIComponent(cookie.slice(prefix.length));
            } catch (error) {
                return "";
            }
        }

        function saveCookie(name, value) {
            const maxAge = value ? 31536000 : 0;
            document.cookie = name + "=" + encodeURIComponent(value) +
                "; Max-Age=" + maxAge + "; Path=/; SameSite=Lax";
        }

        document.getElementById("characterForm").addEventListener("submit", function (event) {
            event.preventDefault();
            const characterName = characterInput.value.trim();
            const realmCode = realmSelect.value;
            if (characterName && !Object.values(realmCodeMap).includes(realmCode)) {
                characterSaveStatus.textContent = "請選擇伺服器。";
                characterSaveStatus.hidden = false;
                return;
            }
            saveCookie(characterCookieName, characterName);
            saveCookie(realmCookieName, realmCode);
            if (readCookie(characterCookieName) !== characterName || readCookie(realmCookieName) !== realmCode) {
                characterSaveStatus.textContent = "角色名稱或伺服器儲存失敗，請確認瀏覽器允許 cookie，並透過 HTTP 或 HTTPS 開啟頁面。";
                characterSaveStatus.hidden = false;
                return;
            }
            window.location.reload();
        });
        const requiredFields = ["emailSuffix", "ReportingPeriod", "ReportPlayers", "RelateAccountFormat", "ReportPlayerScoreHistory", "targetImagePath"];

        const sperateSymbols = ["＃", "※", "＋", "＞"];
        const subjectTemplates = [
            "[Solo / TW region] request to investigate solo rating farming",
            "[TW Region] Request to Investigate Suspected Solo Rating Farming",
            "[Solo] Request for Review of Suspected Solo Rating Manipulation in TW solo",
            "[TW Region] Suspected Solo Rating Farming and Match Manipulation",
            "[TW Region｜Solo] Report of Suspected Solo Rating Farming Activity",
            "[TW Region] Request to Review Possible Solo Shuffle Rating Manipulation",
            "[Solo Shuffle / TW] Report of Suspected Rating Manipulation and Win-Trading",
            "[TW] Request Investigate Coordinated Rating Manipulation in Solo Shuffle",
            "[TW Region] Review Request for Suspicious Solo Shuffle Rating boost",
            "[TW／Solo Shuffle] Report of Possible Rating Farming and Match Coordination"
        ];

        const reportingReasonTemplates = [
            "Multiple players appear to be exploiting game mechanics and coordinating to manipulate Solo Shuffle ratings, potentially involving rating farming, win-trading during the specified reporting period",
            "Several players are suspected of working together to abuse Solo Shuffle mechanics and influence ratings through coordinated matches, possible rating manipulation, win-trading during the specified reporting period.",
            "The reported activity raises concerns about possible coordination among players to manipulate Solo Shuffle ratings, including suspected rating farming, win-trading during the specified reporting period.",
            "Some players appear to be coordinating their Solo Shuffle activity to gain unfair rating advantages, with possible involvement in rating manipulation, win-trading during the specified reporting period",
            "I request a review of suspected coordinated abuse of Solo Shuffle mechanics, particularly possible rating manipulation, rating manipulation, win-trading during the reporting period."
        ];

        const conclusionTemplates = [
            "Please review the listed characters’ Solo Shuffle activity during the reporting period, including queue records, arena data, gameplay, account access, and interactions with associated accounts.",
            "I respectfully request an investigation into the reported characters’ Solo Shuffle activity within the specified timeframe, covering queue history, arena records, gameplay, and interactions with linked accounts.",
            "Please examine the relevant internal records for these characters during the stated period, including Solo Shuffle queues, gameplay, account access, and interactions with related accounts.",
            "I ask Blizzard to investigate the listed characters’ Solo Shuffle participation during the specified period by reviewing queue records, gameplay, and interactions with associated accounts.",
            "Please assess the reported Solo Shuffle activity within the indicated timeframe, reviewing the listed characters’ queue records, gameplay, account access, and interactions with connected accounts."
        ];

        function buildEmailBody(item) {
            const violations = [
                "- Account sharing between multiple people",
                "- Intentional disruption and griefing in arenas",
                "- Coordinated queue sniping, rating manipulation, and win-trading",
                "- Reported by multiple players in-game (reporting system)"
            ];
            for (let index = violations.length - 1; index > 0; index--) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                const value = violations[index];
                violations[index] = violations[randomIndex];
                violations[randomIndex] = value;
            }
            const conclusion = conclusionTemplates[Math.floor(Math.random() * conclusionTemplates.length)];
            const reportingReason = reportingReasonTemplates[Math.floor(Math.random() * reportingReasonTemplates.length)];
            const sperateSymbol = sperateSymbols[Math.floor(Math.random() * sperateSymbols.length)];
            return `${sperateSymbol} Regions:
TW region (Taiwan region)

${sperateSymbol} Reporting Period:
${item.ReportingPeriod}

${sperateSymbol} Arena type:
Solo shuffle

${sperateSymbol} Reported Players:
${item.ReportPlayers}

${sperateSymbol} Reason for Reporting:
${reportingReason} Please refer to the screenshot image url: ${item.targetImagePath} (check pvp website)


${sperateSymbol} Description
I am a player from Taiwan region.${savedCharacterName ? "\nMy character is " + savedCharacterName + (savedRealmCode ? "-" + savedRealmCode + " ." : "") : ""}
I am submitting this report to request an investigation into possible coordinated rating manipulation and gameplay sabotage in Solo Shuffle.
These characters have suspicious match record, rating farming during the specified reporting period.
I respectfully request that Blizzard examine the relevant internal records to determine whether any of the following violations occurred:
${violations.join("\n")}


${item.RelateAccountFormat.includes("#Account 1") ? `${sperateSymbol} Most of the characters associated with specific Battle accounts.
By cross-referencing their achievements, I identified multiple characters associated with the same Battle.net accounts.\n${item.RelateAccountFormat}
` : ""}

${sperateSymbol} Conclusion:
${conclusion}

${sperateSymbol} Supporting Evidence:
*Data source 1 (by wow check pvp website)
Screenshot image url:
${item.targetImagePath}

*Data source 2 (Blizzard Developer API)
With the assistance of players with technical expertise, information was collected through the official Blizzard Developer API endpoint:
data/wow/pvp-season/{season_pvp_id}/pvp-leaderboard/shuffle-overall

This API is updated every 3 hours. By comparing with api records, it is possible to identify players whose ratings changed during each three-hour period.

${sperateSymbol} Additional Reference:
With a technical player support, I compiled a list of multiple characters linked to same Battle.net account that have repeatedly exhibited abnormal rating activity. 
I would like Blizzard to investigate these players. Please refer to the links below for supporting evidence.
https://tw-wow-pvp.wow-pvp-check-tw.workers.dev
`;
        }

        function appendTextSection(container, title, text) {
            const heading = document.createElement("h2");
            heading.textContent = title;
            const content = document.createElement("pre");
            content.textContent = text;
            container.append(heading, content);
        }

        function isMobileDevice() {
            if (navigator.userAgentData && navigator.userAgentData.mobile) {
                return true;
            }
            return /Android|iPhone|iPad|iPod|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
        }

        function openGmail(subject, body) {
            if (isMobileDevice()) {
                window.alert("此功能只允許電腦版操作");
                return;
            }
            const parameters = new URLSearchParams({
                view: "cm",
                fs: "1",
                to: "hacks@blizzard.com",
                su: subject,
                body: body
            });

            window.open(
                "https://mail.google.com/mail/?" + parameters.toString(),
                "_blank",
                "noopener,noreferrer"
            );
        }

        function openOutlook(subject, body) {
            if (isMobileDevice()) {
                window.alert("此功能只允許電腦版操作");
                return;
            }
            const parameters = new URLSearchParams({
                to: "hacks@blizzard.com",
                subject: subject,
                body: body
            });
            const query = parameters.toString().replace(/\+/g, "%20");

            window.open(
                "https://outlook.live.com/mail/0/deeplink/compose?" + query,
                "_blank",
                "noopener,noreferrer"
            );
        }

        function renderReports(items) {
            reportEntries.length = 0;
            const fragment = document.createDocumentFragment();
            items.forEach(function (item, index) {
                const accordion = document.createElement("details");
                const summary = document.createElement("summary");
                const summaryText = document.createElement("span");
                summaryText.className = "summary-text";
                summaryText.textContent = "單排紀錄: " + item.emailSuffix.replace(/[()]/g, "").replace("GMT+8" , "");
                summary.append(summaryText);
                const summaryTags = document.createElement("span");
                summaryTags.className = "summary-tags";
                const timeMatch = item.emailSuffix.match(/(?:^|[\s(T])([01]?\d|2[0-3]):[0-5]\d\b/);
                if (timeMatch && Number(timeMatch[1]) <= 5) {
                    // const earlyMorningChip = document.createElement("span");
                    // earlyMorningChip.className = "high-round-chip early-morning-chip";
                    // earlyMorningChip.textContent = "凌晨";
                    // summaryTags.append(earlyMorningChip);
                }
                if (item.PlayerCount >= 15) {
                    const manyPlayersChip = document.createElement("span");
                    manyPlayersChip.className = "high-round-chip many-players-chip";
                    manyPlayersChip.textContent = "角色很多";
                    summaryTags.prepend(manyPlayersChip);
                }
                let roundLabel = "";
                if (item.MaxWinLossRound > 70) {
                    roundLabel = "極高場次";
                } else if (item.MaxWinLossRound > 40) {
                    roundLabel = "高場次";
                }
                if (roundLabel) {
                    const highRoundChip = document.createElement("span");
                    highRoundChip.className = item.MaxWinLossRound > 70 ? "high-round-chip extreme-round-chip" : "high-round-chip";
                    highRoundChip.textContent = roundLabel;
                    summaryTags.prepend(highRoundChip);
                }
                if (summaryTags.childElementCount > 0) {
                    summary.append(summaryTags);
                }
                const email = document.createElement("div");
                email.className = "email";
                const subject = subjectTemplates[Math.floor(Math.random() * subjectTemplates.length)] + " " + item.emailSuffix;
                const body = buildEmailBody(item);
                const gmailButton = document.createElement("button");
                gmailButton.type = "button";
                gmailButton.textContent = "👆點擊此 開啟Gmail寄信";
                gmailButton.addEventListener("click", function () {
                    openGmail(subject, body);
                });
                const outlookButton = document.createElement("button");
                outlookButton.type = "button";
                outlookButton.textContent = "👆點擊此 開啟outlook寄信";
                outlookButton.addEventListener("click", function () {
                    openOutlook(subject, body);
                });
                const participationHint = document.createElement("span");
                participationHint.className = "participation-hint";
                participationHint.textContent = "歡迎大家響應一起寄信投訴 👍👍";
                email.append(gmailButton, outlookButton, participationHint);
                appendTextSection(email, "⭐收件信箱⭐", "hacks@blizzard.com");
                appendTextSection(email, "⭐信件標題⭐", subject);
                appendTextSection(email, "⭐信件內容⭐", body);
                const imageHint = document.createElement("p");
                imageHint.style.marginTop = "40px";
                imageHint.textContent = "⭐建議此圖片 手動加入信件內容中 或 信件附檔中 (PrintScreen鍵 或  windows鍵 + shift + S)";
                email.append(imageHint);
                const image = document.createElement("img");
                image.className = "report-image";
                image.alt = "Check-PvP 截圖 " + item.emailSuffix;
                accordion.addEventListener("toggle", function () {
                    if (accordion.open && !image.hasAttribute("src")) {
                        image.src = item.targetImagePath;
                    }
                });
                const imageLink = document.createElement("a");
                imageLink.href = item.targetImagePath;
                imageLink.target = "_blank";
                imageLink.rel = "noopener noreferrer";
                imageLink.append(image);
                email.append(imageLink);
                accordion.append(summary, email);
                reportEntries.push({ accordion: accordion, players: item.ReportPlayers.toLowerCase() });
                fragment.append(accordion);
            });
            reports.replaceChildren(fragment);
            filterReports();
        }

        function loadReports() {
            playerSearch.disabled = true;
            status.textContent = "正在載入資料…";
            status.className = "";
            retry.hidden = true;
            retry.disabled = true;
            reports.setAttribute("aria-busy", "true");
            const controller = new AbortController();
            const timeout = window.setTimeout(function () { controller.abort(); }, 30000);
            fetch(`${dataUrl}?v=${Date.now()}`, { signal: controller.signal, cache: "no-store" })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("HTTP " + response.status);
                    }
                    return response.json();
                })
                .then(function (items) {
                    if (!Array.isArray(items)) {
                        throw new Error("JSON 資料必須是陣列。");
                    }
                    items.forEach(function (item, index) {
                        if (!item || typeof item !== "object" || Array.isArray(item)) {
                            throw new Error("第 " + (index + 1) + " 筆資料必須是物件。");
                        }
                        requiredFields.forEach(function (field) {
                            if (typeof item[field] !== "string") {
                                throw new Error("第 " + (index + 1) + " 筆的 " + field + " 欄位必須是字串。");
                            }
                        });
                    });
                    renderReports(items);
                    playerSearch.disabled = false;
                })
                .catch(function (error) {
                    reportEntries.length = 0;
                    reports.replaceChildren();
                    status.className = "error";
                    status.textContent = error.name === "AbortError" ? "載入逾時，請重新載入。" : "載入失敗：" + error.message + " 請確認網路連線及端點是否允許跨來源存取（CORS）。";
                    retry.hidden = false;
                })
                .finally(function () {
                    window.clearTimeout(timeout);
                    retry.disabled = false;
                    reports.setAttribute("aria-busy", "false");
                });
        }

        retry.addEventListener("click", loadReports);
        loadReports();
    </script>
</body>
</html>
