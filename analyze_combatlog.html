        <p class="muted">選取 WoWCombatLog.txt，檢視競技場地圖、回合時間及檢舉報告。檔案只在本機處理，不會上傳。</p>

            <progress id="progress" value="0" max="100" aria-label="解析進度"></progress>

    <script>
        function combatWorker() {
            function fields(text) {
                const result = [];
                let value = '', quoted = false;
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    if (char === '"') {
                        if (quoted && text[i + 1] === '"') { value += '"'; i++; }
                        else { quoted = !quoted; }
                    } else if (char === ',' && !quoted) { result.push(value); value = ''; }
                    else { value += char; }
                }
                if (quoted) { throw new Error('CSV 引號未閉合'); }
                result.push(value);
                return result;
            }
            function stamp(text) {
                const match = text.match(/^(\d+)\/(\d+)(?:\/(\d+))? (\d+):(\d+):(\d+)(?:\.(\d+))?$/);
                if (!match) { return NaN; }
                return Date.UTC(Number(match[3] || 2000), Number(match[1]) - 1, Number(match[2]), Number(match[4]), Number(match[5]), Number(match[6])) + Number('0.' + (match[7] || '0')) * 1000;
            }
            self.onmessage = async function (message) {
                try {
                    const file = message.data;
                    const names = new Map(), owners = new Map(), rounds = [], warnings = new Set();
                    let current = null, zone = null, version = false, lineNumber = 0, bad = 0, lastTime = '', bytes = 0;
                    function finish(time, reason) {
                        if (current && !current.end) { current.end = time; current.reason = reason; }
                    }
                    function processLine(line) {
                        lineNumber++;
                        if (!line.trim()) { return; }
                        const match = line.match(/^(.*?)\s{2,}([A-Z_]+),(.+)$/);
                        if (!match) { bad++; return; }
                        const time = match[1], event = match[2];
                        lastTime = time;
                        if (event === 'COMBAT_LOG_VERSION') {
                            const a = fields(event + ',' + match[3]);
                            if (a[1] !== '22' || a[a.indexOf('ADVANCED_LOG_ENABLED') + 1] !== '1') {
                                throw new Error('不支援此紀錄格式：需要 COMBAT_LOG_VERSION 22 且 ADVANCED_LOG_ENABLED 1。');
                            }
                            version = true; return;
                        }
                        if (!version) { throw new Error('找不到開頭的 COMBAT_LOG_VERSION；請選取包含版本資訊的完整原始 log。'); }
                        if (event === 'COMBATANT_INFO') {
                            if (current && !current.end) {
                                const a = match[3].split(',', 26);
                                current.players.set(a[0], a[24]);
                                current.teams.set(a[0], a[1]);
                            }
                            return;
                        }
                        let a;
                        try { a = fields(event + ',' + match[3]); } catch (_) { bad++; return; }
                        if (event === 'ZONE_CHANGE') {
                            finish(time, '缺少結束事件，以離開地圖時間截斷');
                            zone = { id: a[1], name: a[2] }; current = null; return;
                        }
                        if (event === 'ARENA_MATCH_START') {
                            finish(time, '缺少結束事件，以下一回合開始時間截斷');
                            current = { start: time, end: null, reason: '', death: '', mapId: a[1], map: zone && zone.id === a[1] ? zone.name : '未知地圖', mode: a[3], players: new Map(), teams: new Map(), sources: new Map() };
                            rounds.push(current); return;
                        }
                        if (event === 'ARENA_MATCH_END') { finish(time, '回合結束事件'); return; }
                        if (a[1]?.startsWith('Player-')) { names.set(a[1], a[2]); }
                        if (a[5]?.startsWith('Player-')) { names.set(a[5], a[6]); }
                        if (event === 'SPELL_SUMMON') { owners.set(a[5], a[1]); }
                        const prefix = event.startsWith('SWING_') ? 9 : 12;
                        if (/^(Pet|Creature)-/.test(a[prefix] || '') && a[prefix + 1]?.startsWith('Player-')) { owners.set(a[prefix], a[prefix + 1]); }
                        if (!current || current.end) { return; }
                        if (event === 'UNIT_DIED' && a[5]?.startsWith('Player-') && /Solo Shuffle/i.test(current.mode)) {
                            current.death = a[5]; finish(time, '首次玩家死亡'); return;
                        }
                        let kind, value, source = a[1];
                        function number(index) {
                            if (!/^-?\d+(?:\.\d+)?$/.test(a[index] || '')) { throw new Error('數值欄位異常'); }
                            return Number(a[index]);
                        }
                        try {
                            if (['SWING_DAMAGE', 'RANGE_DAMAGE', 'SPELL_DAMAGE', 'SPELL_PERIODIC_DAMAGE', 'DAMAGE_SHIELD', 'SPELL_BUILDING_DAMAGE'].includes(event)) {
                                kind = 'damage'; value = Math.max(0, number(prefix + 19) - Math.max(0, number(prefix + 21)));
                            } else if (['SPELL_HEAL', 'SPELL_PERIODIC_HEAL', 'SPELL_BUILDING_HEAL'].includes(event)) {
                                kind = 'heal'; value = Math.max(0, number(31) - number(33));
                            } else if (event === 'SPELL_ABSORBED') {
                                const offset = /^(Player|Pet|Creature)-/.test(a[9] || '') || a[9] === '0000000000000000' ? 9 : 12;
                                kind = 'absorb'; source = a[offset]; value = number(offset + 7);
                            } else { return; }
                        } catch (_) { bad++; return; }
                        if (!current.sources.has(source)) { current.sources.set(source, { damage: 0, playerDamage: 0, heal: 0, absorb: 0 }); }
                        const stat = current.sources.get(source);
                        stat[kind] += value;
                        if (kind === 'damage' && a[5]?.startsWith('Player-')) { stat.playerDamage += value; }
                    }
                    const reader = file.stream().getReader(), decoder = new TextDecoder('utf-8');
                    let buffer = '';
                    while (true) {
                        const chunk = await reader.read();
                        if (chunk.done) { break; }
                        bytes += chunk.value.byteLength;
                        buffer += decoder.decode(chunk.value, { stream: true });
                        const lines = buffer.split('\n'); buffer = lines.pop();
                        for (const line of lines) { processLine(line.replace(/\r$/, '')); }
                        self.postMessage({ type: 'progress', value: Math.min(99, Math.floor(bytes / file.size * 100)) });
                    }
                    buffer += decoder.decode();
                    if (buffer) { processLine(buffer.replace(/\r$/, '')); }
                    finish(lastTime, '檔案結尾，缺少回合結束');
                    if (!version) { throw new Error('檔案為空或不是支援的 WoW 戰鬥紀錄。'); }
                    if (!rounds.length) { throw new Error('找不到 ARENA_MATCH_START，無法產生競技場回合分析。'); }
                    if (bad) { warnings.add('有 ' + bad + ' 行格式異常或數值欄位不完整，已略過；統計可能不完整。'); }
                    function owner(guid) {
                        const visited = new Set();
                        while (owners.has(guid) && !visited.has(guid)) { visited.add(guid); guid = owners.get(guid); }
                        return guid;
                    }
                    let unattributed = 0;
                    const result = rounds.map(function (round) {
                        const stats = new Map();
                        function ensure(guid) {
                            if (!stats.has(guid)) { stats.set(guid, { guid: guid, name: names.get(guid) || guid, damage: 0, playerDamage: 0, heal: 0, absorb: 0 }); }
                            return stats.get(guid);
                        }
                        for (const guid of round.players.keys()) { ensure(guid); }
                        for (const [guid, values] of round.sources) {
                            const player = owner(guid);
                            if (!player?.startsWith('Player-')) { unattributed += values.damage + values.heal + values.absorb; continue; }
                            const stat = ensure(player);
                            for (const key of ['damage', 'playerDamage', 'heal', 'absorb']) { stat[key] += values[key]; }
                        }
                        return { start: round.start, end: round.end, duration: Math.max(0, (stamp(round.end) - stamp(round.start)) / 1000), reason: round.reason, deathGuid: round.death, teams: Object.fromEntries(round.teams), death: names.get(round.death) || round.death, map: round.map, mapId: round.mapId, mode: round.mode, stats: Array.from(stats.values()) };
                    });
                    if (unattributed) { 
                       

                    
                    }
                    self.postMessage({ type: 'result', rounds: result, warnings: Array.from(warnings), lines: lineNumber });
                } catch (error) { self.postMessage({ type: 'error', message: error.message }); }
            };
        }

                const realm = normalized.slice(normalized.indexOf('-') + 1).split('-')
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
                return character + '-' + realm;
            }).join('、');
            const lossAnalysis = findHighestLossPlayers(data.rounds);
            const firstRound = data.rounds[0], lastRound = data.rounds[data.rounds.length - 1];
            const dateTime = value => value ? value.replace(/\.\d+$/, '') : '未記錄';
            const timeOnly = value => value ? (value.match(/\d{2}:\d{2}:\d{2}/) || ['未記錄'])[0] : '未記錄';
            const matchDate = firstRound.start.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s/);
            const subjectDate = matchDate ? ' (' + matchDate[3] + '/' + matchDate[1].padStart(2, '0') + '/' + matchDate[2].padStart(2, '0') + ')' : '';
            const paragraphs = [
                '⭐⭐信件標題⭐⭐\n' + '[TW region] solo shuffle griefing and intentional throwing' + subjectDate + '\n\n',
                '⭐⭐信件內容⭐⭐\n',
                '※ Regions:\n' + 'TW region (Taiwan region)',
                '※ Reporting Period:\n' + dateTime(firstRound.start) + ' ~ ' + dateTime(lastRound.end) + ' (GMT+8)',
                '※ Arena type:\nSolo shuffle',
                '※ Arena map:\n' + [...new Set(data.rounds.map(round => round.map))].join('、'),
                '※ Reported Players:\n' + (reportedNames ? reportedNames.split('、').join('\n') : '無符合名單的玩家')
            ];
            if (specialPlayers.matched.length) {
                const names = reportedNames.split('、');
                const englishNames = names.length > 2 ? names.slice(0, -1).join(', ') + ', and ' + names[names.length - 1] : names.join(' and ');
                paragraphs.push('※ Description\nI am submitting a report regarding suspicious behavior by ' + englishNames + '.\n\nThese players appear to be intentionally throwing games by deliberately withholding major cooldowns and defensives during critical moments. Despite having been penalized in the past and repeatedly reported by multiple players through the reporting system, they continue to maliciously sabotage gameplay.');
                for (const player of lossAnalysis.players) {
                    paragraphs[paragraphs.length - 1] += '\n\nFurthermore, it is clearly evident that the reported players are deliberately manipulating match outcomes to inflate the total number of losses for ' + formatReportPlayer(player.name) + ". This constitutes targeted griefing and a malicious attempt to ruin that player's overall gaming experience.";
                }
            } else {
                paragraphs.push('※ Extra Description\n無符合名單的玩家，不產生檢舉描述。');
            }
            if (!lossAnalysis.complete) {
                timeline.append(node('p', '部分回合缺少完整隊伍或勝負資料，未產生最高敗場相關描述。', 'muted'));
            }
            const roundLines = data.rounds.map(function (round, index) {
                const death = round.death ? round.death.replace(/-KR$/i, '') : '未記錄';
                const duration = Number.isFinite(round.duration) ? Math.floor(round.duration) + ' seconds' : '無法計算';
                return 'Round ' + (index + 1) + '，' + timeOnly(round.start) + ' ~ ' + timeOnly(round.end) + ', Player Eliminated：' + death + '，total time：' + duration;
            });
            paragraphs.push('※ Round information\n' + roundLines.join('\n'));
            for (const paragraph of paragraphs) {
                const text = node('p', paragraph); text.style.whiteSpace = 'pre-line'; timeline.append(text);
            }
            if (specialPlayers.matched.length) {
                
            }
            if (specialPlayers.unknown.length) {
                timeline.append(node('p', '以下玩家的伺服器無法轉換，未完成比對：' + specialPlayers.unknown.join('、') + '。'));
            }
            data.rounds.forEach(function (round, index) {
                if (/缺少/.test(round.reason)) {
                    timeline.append(node('p', 'Round ' + (index + 1) + '：' + round.reason + '，時間包含截斷區間。'));
                }
            });
            results.append(timeline);

        }
        cancel.addEventListener('click', function () { stop(); status.textContent = '已取消，可重新選取檔案。'; fileInput.value = ''; });
        fileInput.addEventListener('change', function () {
            stop(); results.replaceChildren(); overview.replaceChildren(); overview.hidden = true; document.getElementById('warnings').textContent = ''; progress.value = 0;
            const file = fileInput.files[0]; if (!file) { status.textContent = '尚未選取檔案。'; return; }
            status.textContent = '正在解析 ' + file.name + '（' + (file.size / 1048576).toFixed(1) + ' MB）…';
            try {
                const url = URL.createObjectURL(new Blob(['(' + combatWorker.toString() + ')();'], { type: 'text/javascript' }));
                try { worker = new Worker(url); } finally { URL.revokeObjectURL(url); }
                cancel.disabled = false;
                worker.onmessage = function (event) {
                    const data = event.data;
                    if (data.type === 'progress') { progress.value = data.value; return; }
                    stop(); fileInput.value = '';
                    if (data.type === 'error') { status.textContent = '解析失敗：' + data.message; return; }
                    progress.value = 100; render(data); status.textContent = file.name + '｜分析完成，共 ' + data.lines.toLocaleString('en-US') + ' 行、' + data.rounds.length + ' 個回合。';
                };
                worker.onerror = function () { stop(); fileInput.value = ''; status.textContent = '解析工作無法執行，請使用新版 Edge 或 Chrome 開啟此 HTML。'; };
                worker.postMessage(file);
            } catch (error) { stop(); fileInput.value = ''; status.textContent = '無法啟動解析：' + error.message; }
        });
    </script>
