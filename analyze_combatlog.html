<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WoW 戰鬥紀錄轉投訴信</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #101010; color: #fff; font-family: "Microsoft JhengHei", sans-serif; line-height: 1.7; }
        main { max-width: 1320px; margin: 40px auto; padding: 0 20px; }
        h1 { margin-bottom: 8px; } h2 { font-size: 21px; margin: 0 0 8px; }
        p { margin: 8px 0; } .muted, small { color: #a7aeb6; }
        .panel, .round { background: #191919; border: 1px solid #303035; border-radius: 8px; padding: 20px; margin: 20px 0; }
        input { max-width: 100%; } input::file-selector-button, button { background: #2971cb; border: 0; border-radius: 5px; padding: 10px 16px; color: #fff; cursor: pointer; margin-right: 12px; }
        .gmail-button { background: #c62828; padding: 18px 30px; font-size: 20px; font-weight: 700; line-height: 1.5; max-width: 100%; margin-bottom: 16px; }
        .gmail-button:hover { background: #a61f1f; }
        button:disabled { opacity: .5; cursor: default; } :focus-visible { outline: 2px solid #83bfff; outline-offset: 3px; }
        progress { width: 100%; height: 10px; accent-color: #2971cb; }
        .summary { display: flex; flex-wrap: wrap; gap: 16px 40px; } .summary strong { display: block; font-size: 24px; }
        .table-scroll { overflow-x: auto; } table { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; border-bottom: 1px solid #303035; text-align: right; font-variant-numeric: tabular-nums; }
        th { color: #a7aeb6; font-weight: 500; white-space: nowrap; } th:first-child, td:first-child { text-align: left; }
        tbody tr:hover { background: #ffffff06; } .warning { color: #ffca77; white-space: pre-line; } .dead { color: #ffaaa6; }
        [hidden] { display: none !important; } @media(max-width: 700px) { main { margin: 20px auto; padding: 0 12px; } .panel, .round { padding: 14px; } }
    </style>
</head>
<body>
    <main>
        <h1>WoW 戰鬥紀錄轉投訴信</h1>
        <p class="muted">選取 WoWCombatLog.txt，檢視競技場地圖、回合時間及檢舉報告。檔案只在本機處理，不會上傳。</p>
        <section class="panel">
            <label for="log-file">選取戰鬥紀錄（.txt）</label>
            <p><input id="log-file" type="file" accept=".txt,text/plain" disabled> <button id="cancel" type="button" disabled>取消解析</button></p>
            <progress id="progress" value="0" max="100" aria-label="解析進度"></progress>
            <p id="status" role="status" aria-live="polite">正在載入特殊玩家名單…</p>
        </section>

        <p id="warnings" class="warning" role="status"></p>
        <section id="overview" class="panel summary" hidden></section>
        <div id="results"></div>
    </main>
    <script>
        function combatWorker() {
            function fields(text) {
                const result = [];
                let value = '', quoted = false;
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    if (char === '"') {
                        if (quoted && text[i + 1] === '"') { value += '"'; i++; }
                        else { quoted = !quoted; }
                    } else if (char === ',' && !quoted) { result.push(value); value = ''; }
                    else { value += char; }
                }
                if (quoted) { throw new Error('CSV 引號未閉合'); }
                result.push(value);
                return result;
            }
            function stamp(text) {
                const match = text.match(/^(\d+)\/(\d+)(?:\/(\d+))? (\d+):(\d+):(\d+)(?:\.(\d+))?$/);
                if (!match) { return NaN; }
                return Date.UTC(Number(match[3] || 2000), Number(match[1]) - 1, Number(match[2]), Number(match[4]), Number(match[5]), Number(match[6])) + Number('0.' + (match[7] || '0')) * 1000;
            }
            self.onmessage = async function (message) {
                try {
                    const file = message.data;
                    const names = new Map(), owners = new Map(), rounds = [], warnings = new Set();
                    let current = null, zone = null, version = false, lineNumber = 0, bad = 0, lastTime = '', bytes = 0;
                    function finish(time, reason) {
                        if (current && !current.end) { current.end = time; current.reason = reason; }
                    }
                    function processLine(line) {
                        lineNumber++;
                        if (!line.trim()) { return; }
                        const match = line.match(/^(.*?)\s{2,}([A-Z_]+),(.+)$/);
                        if (!match) { bad++; return; }
                        const time = match[1], event = match[2];
                        lastTime = time;
                        if (event === 'COMBAT_LOG_VERSION') {
                            const a = fields(event + ',' + match[3]);
                            if (a[1] !== '22' || a[a.indexOf('ADVANCED_LOG_ENABLED') + 1] !== '1') {
                                throw new Error('不支援此紀錄格式：需要 COMBAT_LOG_VERSION 22 且 ADVANCED_LOG_ENABLED 1。');
                            }
                            version = true; return;
                        }
                        if (!version) { throw new Error('找不到開頭的 COMBAT_LOG_VERSION；請選取包含版本資訊的完整原始 log。'); }
                        if (event === 'COMBATANT_INFO') {
                            if (current && !current.end) {
                                const a = match[3].split(',', 26);
                                current.players.set(a[0], a[24]);
                                current.teams.set(a[0], a[1]);
                            }
                            return;
                        }
                        let a;
                        try { a = fields(event + ',' + match[3]); } catch (_) { bad++; return; }
                        if (event === 'ZONE_CHANGE') {
                            finish(time, '缺少結束事件，以離開地圖時間截斷');
                            zone = { id: a[1], name: a[2] }; current = null; return;
                        }
                        if (event === 'ARENA_MATCH_START') {
                            finish(time, '缺少結束事件，以下一回合開始時間截斷');
                            current = { start: time, end: null, reason: '', death: '', mapId: a[1], map: zone && zone.id === a[1] ? zone.name : '未知地圖', mode: a[3], players: new Map(), teams: new Map(), sources: new Map() };
                            rounds.push(current); return;
                        }
                        if (event === 'ARENA_MATCH_END') { finish(time, '回合結束事件'); return; }
                        if (a[1]?.startsWith('Player-')) { names.set(a[1], a[2]); }
                        if (a[5]?.startsWith('Player-')) { names.set(a[5], a[6]); }
                        if (event === 'SPELL_SUMMON') { owners.set(a[5], a[1]); }
                        const prefix = event.startsWith('SWING_') ? 9 : 12;
                        if (/^(Pet|Creature)-/.test(a[prefix] || '') && a[prefix + 1]?.startsWith('Player-')) { owners.set(a[prefix], a[prefix + 1]); }
                        if (!current || current.end) { return; }
                        if (event === 'UNIT_DIED' && a[5]?.startsWith('Player-') && /Solo Shuffle/i.test(current.mode) && a[a.length - 1] === '0') {
                            current.death = a[5]; finish(time, '首次玩家死亡'); return;
                        }
                        let kind, value, source = a[1];
                        function number(index) {
                            if (!/^-?\d+(?:\.\d+)?$/.test(a[index] || '')) { throw new Error('數值欄位異常'); }
                            return Number(a[index]);
                        }
                        try {
                            if (['SWING_DAMAGE', 'RANGE_DAMAGE', 'SPELL_DAMAGE', 'SPELL_PERIODIC_DAMAGE', 'DAMAGE_SHIELD', 'SPELL_BUILDING_DAMAGE'].includes(event)) {
                                kind = 'damage'; value = Math.max(0, number(prefix + 19) - Math.max(0, number(prefix + 21)));
                            } else if (['SPELL_HEAL', 'SPELL_PERIODIC_HEAL', 'SPELL_BUILDING_HEAL'].includes(event)) {
                                kind = 'heal'; value = Math.max(0, number(31) - number(33));
                            } else if (event === 'SPELL_ABSORBED') {
                                const offset = /^(Player|Pet|Creature)-/.test(a[9] || '') || a[9] === '0000000000000000' ? 9 : 12;
                                kind = 'absorb'; source = a[offset]; value = number(offset + 7);
                            } else { return; }
                        } catch (_) { bad++; return; }
                        if (!current.sources.has(source)) { current.sources.set(source, { damage: 0, playerDamage: 0, heal: 0, absorb: 0 }); }
                        const stat = current.sources.get(source);
                        stat[kind] += value;
                        if (kind === 'damage' && a[5]?.startsWith('Player-')) { stat.playerDamage += value; }
                    }
                    const reader = file.stream().getReader(), decoder = new TextDecoder('utf-8');
                    let buffer = '';
                    while (true) {
                        const chunk = await reader.read();
                        if (chunk.done) { break; }
                        bytes += chunk.value.byteLength;
                        buffer += decoder.decode(chunk.value, { stream: true });
                        const lines = buffer.split('\n'); buffer = lines.pop();
                        for (const line of lines) { processLine(line.replace(/\r$/, '')); }
                        self.postMessage({ type: 'progress', value: Math.min(99, Math.floor(bytes / file.size * 100)) });
                    }
                    buffer += decoder.decode();
                    if (buffer) { processLine(buffer.replace(/\r$/, '')); }
                    finish(lastTime, '檔案結尾，缺少回合結束');
                    if (!version) { throw new Error('檔案為空或不是支援的 WoW 戰鬥紀錄。'); }
                    if (!rounds.length) { throw new Error('找不到 ARENA_MATCH_START，無法產生競技場回合分析。'); }
                    if (bad) { warnings.add('有 ' + bad + ' 行格式異常或數值欄位不完整，已略過；統計可能不完整。'); }
                    function owner(guid) {
                        const visited = new Set();
                        while (owners.has(guid) && !visited.has(guid)) { visited.add(guid); guid = owners.get(guid); }
                        return guid;
                    }
                    let unattributed = 0;
                    const result = rounds.map(function (round) {
                        const stats = new Map();
                        function ensure(guid) {
                            if (!stats.has(guid)) { stats.set(guid, { guid: guid, name: names.get(guid) || guid, damage: 0, playerDamage: 0, heal: 0, absorb: 0 }); }
                            return stats.get(guid);
                        }
                        for (const guid of round.players.keys()) { ensure(guid); }
                        for (const [guid, values] of round.sources) {
                            const player = owner(guid);
                            if (!player?.startsWith('Player-')) { unattributed += values.damage + values.heal + values.absorb; continue; }
                            const stat = ensure(player);
                            for (const key of ['damage', 'playerDamage', 'heal', 'absorb']) { stat[key] += values[key]; }
                        }
                        return { start: round.start, end: round.end, duration: Math.max(0, (stamp(round.end) - stamp(round.start)) / 1000), reason: round.reason, deathGuid: round.death, teams: Object.fromEntries(round.teams), death: names.get(round.death) || round.death, map: round.map, mapId: round.mapId, mode: round.mode, stats: Array.from(stats.values()) };
                    });
                    if (unattributed) { 
                       

                    
                    }
                    self.postMessage({ type: 'result', rounds: result, warnings: Array.from(warnings), lines: lineNumber });
                } catch (error) { self.postMessage({ type: 'error', message: error.message }); }
            };
        }
        const fileInput = document.getElementById('log-file');
        const status = document.getElementById('status');
        const progress = document.getElementById('progress');
        const cancel = document.getElementById('cancel');
        const results = document.getElementById('results');
        const overview = document.getElementById('overview');
        let worker = null;
        function stop() { if (worker) { worker.terminate(); worker = null; } cancel.disabled = true; }
        function node(tag, text, className) { const element = document.createElement(tag); if (text !== undefined) { element.textContent = text; } if (className) { element.className = className; } return element; }
        let characterClasses = [];
        let playersListLoaded = false;
        const realmCodeMap = {
    "憤怒使者": "wrathbringer",
    "暗影之月": "shadowmoon",
    "銀翼要塞": "silverwing-hold",
    "日落沼澤": "sundown-marsh",
    "巨龍之喉": "dragonmaw",
    "阿薩斯": "arthas",
    "血之谷": "bleeding-hollow",
    "冰風崗哨": "chillwind-point",
    "水晶之刺": "crystalpine-stinger",
    "屠魔山谷": "demon-fall-canyon",
    "狂熱之刃": "zealot-blade",
    "克羅之刃": "krol-blade",
    "老馬布蘭契": "old-blanchy",
    "地獄吼": "hellscream",
    "寒冰皇冠": "icecrown",
    "冰霜之刺": "frostmane",
    "米奈希爾": "menethil",
    "尖石": "spirestone",
    "雷鱗": "stormscale",
    "夜空之歌": "nightsong",
    "亞雷戈斯": "arygos",
    "眾星之子": "queldorei",
    "語風": "whisperwind",
    "世界之樹": "world-tree",
    "雲蛟衛": "order-of-the-cloud-serpent",
    "天空之牆": "skywall",
    "聖光之願": "lights-hope"
};
        const specialPlayerNames = new Set();
        function normalizePlayerName(fullName) {
            const name = fullName.trim().replace(/-KR$/i, '').normalize('NFC');
            const separator = name.indexOf('-');
            if (separator < 1) { return null; }
            const character = name.slice(0, separator);
            const realm = name.slice(separator + 1);
            const code = realmCodeMap[realm] || (Object.values(realmCodeMap).includes(realm.toLowerCase()) ? realm.toLowerCase() : null);
            return code ? (character + '-' + code).toLowerCase() : null;
        }
        function matchSpecialPlayers(rounds) {
            const uniquePlayers = new Map(), matched = [], unknown = [];
            for (const round of rounds) {
                for (const player of round.stats) { if (!uniquePlayers.has(player.guid)) { uniquePlayers.set(player.guid, player); } }
            }
            for (const player of uniquePlayers.values()) {
                const normalized = normalizePlayerName(player.name);
                const displayName = player.name.replace(/-KR$/i, '');
                if (!normalized) { unknown.push(displayName); }
                else if (specialPlayerNames.has(normalized)) { matched.push(displayName); }
            }
            return { matched: matched, unknown: unknown };
        }
        function findHighestLossPlayers(rounds) {
            const losses = new Map();
            for (const round of rounds) {
                const teams = round.teams || {};
                const members = Object.entries(teams);
                if (round.reason !== '首次玩家死亡' || !/Solo Shuffle/i.test(round.mode) ||
                    members.length !== 6 || members.filter(([, team]) => team === '0').length !== 3 ||
                    members.filter(([, team]) => team === '1').length !== 3 || !Object.hasOwn(teams, round.deathGuid)) {
                    return { complete: false, players: [], maximum: 0 };
                }
                const losingTeam = teams[round.deathGuid];
                for (const [guid, team] of members) {
                    if (!losses.has(guid)) {
                        const player = round.stats.find(stat => stat.guid === guid);
                        if (!player) { return { complete: false, players: [], maximum: 0 }; }
                        losses.set(guid, { name: player.name, losses: 0 });
                    }
                    if (team === losingTeam) { losses.get(guid).losses++; }
                }
            }
            const maximum = Math.max(0, ...Array.from(losses.values(), player => player.losses));
            const players = Array.from(losses.values()).filter(function (player) {
                const normalized = normalizePlayerName(player.name);
                return player.losses === maximum && maximum >= 5 && normalized && !specialPlayerNames.has(normalized);
            });
            return { complete: true, players: players, maximum: maximum };
        }
        function formatReportPlayer(fullName) {
            const normalized = normalizePlayerName(fullName);
            if (!normalized) { return fullName.replace(/-KR$/i, ''); }
            const character = fullName.slice(0, fullName.indexOf('-'));
            const realm = normalized.slice(normalized.indexOf('-') + 1).split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
            return character + '-' + (realm === 'Queldorei' ? "Quel'dorei" : realm);
        }
        function render(data) {
            const maps = [...new Set(data.rounds.map(round => round.map + '（' + round.mapId + '）'))];
            const players = new Set(data.rounds.flatMap(round => round.stats.map(stat => stat.guid)));
            for (const [label, value] of [['地圖', maps.join('、')], ['回合數', data.rounds.length], ['玩家數', players.size]]) {
                const item = node('div'); item.append(node('span', label, 'muted'), node('strong', value)); overview.append(item);
            }
            overview.hidden = false;
            document.getElementById('warnings').textContent = data.warnings.join('\n');
            const timeline = node('section');
            const specialPlayers = matchSpecialPlayers(data.rounds);
            const reportedNames = specialPlayers.matched.map(function (fullName) {
                const normalized = normalizePlayerName(fullName);
                if (!normalized) { return fullName; }
                const character = fullName.slice(0, fullName.indexOf('-'));
                const realm = normalized.slice(normalized.indexOf('-') + 1).split('-')
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
                return character + '-' + (realm === 'Queldorei' ? "Quel'dorei" : realm);
            }).join('、');
            const lossAnalysis = findHighestLossPlayers(data.rounds);
            const firstRound = data.rounds[0], lastRound = data.rounds[data.rounds.length - 1];
            const dateTime = value => value ? value.replace(/\.\d+$/, '') : '未記錄';
            const timeOnly = value => value ? (value.match(/\d{2}:\d{2}:\d{2}/) || ['未記錄'])[0] : '未記錄';
            const matchDate = firstRound.start.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s/);
            const subjectDate = matchDate ? ' (' + matchDate[3] + '/' + matchDate[1].padStart(2, '0') + '/' + matchDate[2].padStart(2, '0') + ')' : '';
            const emailTitle = '[TW region] solo shuffle griefing and intentional throwing' + subjectDate;
            const paragraphs = [
                '⭐收件信箱⭐\n' + 'hacks@blizzard.com' + '\n\n',
                '⭐信件標題⭐\n' + emailTitle + '\n\n',
                '⭐信件內容⭐\n',
                '※ Regions:\n' + 'TW region (Taiwan region)',
                '※ Reporting Period:\n' + dateTime(firstRound.start) + ' ~ ' + dateTime(lastRound.end) + ' (GMT+8)',
                '※ Arena type:\nSolo shuffle',
                '※ Arena map:\n' + [...new Set(data.rounds.map(round => round.map))].join('、'),
                '※ Attachment:\n' + "⭐🔥💀此區塊請移除，請記得附檔combatlog🔥💀⭐\nPlease refer to the attached file. It contains the WoW combat logs with the battle records I would like to report.",
                '※ Reported Players:\n' + (reportedNames ? reportedNames.split('、').join('\n') : '無符合名單的玩家')
            ];
            if (specialPlayers.matched.length) {
                const names = reportedNames.split('、');
                const englishNames = names.length > 2 ? names.slice(0, -1).join(', ') + ', and ' + names[names.length - 1] : names.join(' and ');
                paragraphs.push('※ Description\nI am submitting a report regarding suspicious behavior by ' + englishNames + '.\n\nThese players appear to be intentionally throwing games by deliberately withholding major cooldowns and defensives during critical moments. Despite having been penalized in the past and repeatedly reported by multiple players through the reporting system, they continue to maliciously sabotage gameplay.');
                for (const player of lossAnalysis.players) {
                    paragraphs[paragraphs.length - 1] += '\n\nFurthermore, it is clearly evident that the reported players are deliberately manipulating match outcomes to inflate the total number of losses for ' + formatReportPlayer(player.name) + ". This constitutes targeted griefing and a malicious attempt to ruin that player's overall gaming experience.";
                }
            } else {
                paragraphs.push('※ Extra Description\n無符合名單的玩家，不產生檢舉描述。');
            }
            if (!lossAnalysis.complete) {
                timeline.append(node('p', '部分回合缺少完整隊伍或勝負資料，未產生最高敗場相關描述。', 'muted'));
            }
            const roundLines = data.rounds.map(function (round, index) {
                const death = round.death ? round.death.replace(/-KR$/i, '') : '未記錄';
                const duration = Number.isFinite(round.duration) ? Math.floor(round.duration) + ' seconds' : '無法計算';
                return 'Round ' + (index + 1) + '，' + timeOnly(round.start) + ' ~ ' + timeOnly(round.end) + ', Player Eliminated：' + death + '，total time：' + duration;
            });
            paragraphs.push('※ Round information\n' + roundLines.join('\n'));
            function openGmail() {
                const contentIndex = paragraphs.findIndex(paragraph => paragraph.trim() === '⭐信件內容⭐');
                const parameters = new URLSearchParams({
                    view: 'cm',
                    fs: '1',
                    to: 'hacks@blizzard.com',
                    su: emailTitle,
                    body: paragraphs.slice(contentIndex + 1).join('\n\n')
                });
                window.open('https://mail.google.com/mail/?' + parameters.toString(), '_blank', 'noopener,noreferrer');
            }
            const gmailButton = node('button', '👆點擊此 開啟Gmail並自動填入文字', 'gmail-button');
            gmailButton.type = 'button';
            gmailButton.addEventListener('click', openGmail);
            timeline.prepend(gmailButton);
            for (const paragraph of paragraphs) {
                const text = node('p', paragraph); text.style.whiteSpace = 'pre-line'; timeline.append(text);
            }
            if (specialPlayers.matched.length) {
                
            }
            if (specialPlayers.unknown.length) {
                timeline.append(node('p', '以下玩家的伺服器無法轉換，未完成比對：' + specialPlayers.unknown.join('、') + '。'));
            }
            data.rounds.forEach(function (round, index) {
                if (/缺少/.test(round.reason)) {
                    timeline.append(node('p', 'Round ' + (index + 1) + '：' + round.reason + '，時間包含截斷區間。'));
                }
            });
            results.append(timeline);

        }
        cancel.addEventListener('click', function () { stop(); status.textContent = '已取消，可重新選取檔案。'; fileInput.value = ''; });
        fileInput.addEventListener('change', function () {
            if (!playersListLoaded) { return; }
            stop(); results.replaceChildren(); overview.replaceChildren(); overview.hidden = true; document.getElementById('warnings').textContent = ''; progress.value = 0;
            const file = fileInput.files[0]; if (!file) { status.textContent = '尚未選取檔案。'; return; }
            status.textContent = '正在解析 ' + file.name + '（' + (file.size / 1048576).toFixed(1) + ' MB）…';
            try {
                const url = URL.createObjectURL(new Blob(['(' + combatWorker.toString() + ')();'], { type: 'text/javascript' }));
                try { worker = new Worker(url); } finally { URL.revokeObjectURL(url); }
                cancel.disabled = false;
                worker.onmessage = function (event) {
                    const data = event.data;
                    if (data.type === 'progress') { progress.value = data.value; return; }
                    stop(); fileInput.value = '';
                    if (data.type === 'error') { status.textContent = '解析失敗：' + data.message; return; }
                    progress.value = 100; render(data); status.textContent = file.name + '｜分析完成，共 ' + data.lines.toLocaleString('en-US') + ' 行、' + data.rounds.length + ' 個回合。';
                };
                worker.onerror = function () { stop(); fileInput.value = ''; status.textContent = '解析工作無法執行，請使用新版 Edge 或 Chrome 開啟此 HTML。'; };
                worker.postMessage(file);
            } catch (error) { stop(); fileInput.value = ''; status.textContent = '無法啟動解析：' + error.message; }
        });
        async function loadCharacterClasses() {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 20000);
            try {
                const response = await fetch('https://wowpvpchecktw2026.github.io/wow_website/players_list.txt', { cache: 'no-store', signal: controller.signal });
                if (!response.ok) { throw new Error('HTTP ' + response.status); }
                const players = await response.json();
                if (!Array.isArray(players) || !players.every(player => player && typeof player.full_name === 'string' && player.full_name.trim() && typeof player.class === 'string')) {
                    throw new Error('名單格式不正確');
                }
                characterClasses = players;
                for (const player of characterClasses) { specialPlayerNames.add(player.full_name.trim().normalize('NFC').toLowerCase()); }
                playersListLoaded = true;
                fileInput.disabled = false;
                status.textContent = '已載入 ' + characterClasses.length.toLocaleString('en-US') + ' 筆特殊玩家名單，請選取 log 檔案。';
            } catch (error) {
                fileInput.disabled = true;
                status.textContent = '特殊玩家名單載入失敗：' + (error.name === 'AbortError' ? '連線逾時' : error.message) + '。請確認網路後重新整理頁面。';
            } finally { clearTimeout(timeout); }
        }
        loadCharacterClasses();
    </script>
</body>
</html>
