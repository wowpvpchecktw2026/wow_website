        th:last-child { border-right: 1px solid #272727; border-radius: 0 5px 5px 0; }
        th:first-child { text-align: left; padding-left: 12px; }
        td { height: 60px; padding: 0 12px; border-bottom: 1px solid #2e2e31; text-align: center; vertical-align: middle; font-weight: 400; }
        tbody tr:first-child td { border-top: 3px solid transparent; }
        tbody tr:hover { background: #ffffff04; }
        .pair { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .pair > :first-child { width: 50%; text-align: right; }
        .pair > :last-child { width: 50%; text-align: left; }
        .mono { font-family: Consolas, "Courier New", monospace; }
        .up { color: #488d48; }
        .down { color: #d25252; }
        .flat { color: #eebf00; }
        .trend { white-space: nowrap; font-size: 14px; }
        .arrow { display: inline-block; width: 24px; font-size: 21px; line-height: 1; vertical-align: -1px; }
        .character { display: flex; align-items: center; text-align: left; }
        .icons { display: flex; align-items: center; gap: 4px; min-width: 100px; }
        .icons img { width: 30px; height: 30px; object-fit: cover; background: #222; font-size: 8px; }
        .icons img:last-child { width: 29px; }
        .name { padding-left: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .summary { display: flex; justify-content: center; align-items: center; gap: 10px; }
        .summary .up, .summary .down { font-size: 19px; min-width: 28px; }
        .summary .up { text-align: right; }
        .summary .down { text-align: left; }
        .updated { white-space: nowrap; }
        @media (max-width: 1024px) { main { margin: 24px auto; padding: 0 12px; } td { height: 40px; } }
        @media (prefers-reduced-motion: no-preference) { tbody tr { transition: background-color .15s; } }

        ];
        const characterClassMap = new Map(characterClasses.map(character => [character.full_name, character.class]));
        const characterColors = new Map();
        const lastUpdatedHours = Math.floor(Math.random() * 5) + 5;

        function parseActivities(text) {
            const rows = [];
            const invalidLines = [];
            text.split(/\r?\n/).forEach((line, index) => {
                if (!line.trim()) return;
                const match = line.match(/^\s*【\s*(\d+)\s*】\s*(.+?)\s*\(\s*([+-]?\d+)\s*,\s*(\d+)\s*:\s*(\d+)\s*\)\s*$/);
                if (!match) {
                    invalidLines.push(index + 1);
                    return;
                }
                rows.push({ rating: match[1], character: match[2].trim(), change: Number(match[3]), wins: match[4], losses: match[5] });
            });
            return { rows, invalidLines };
        }

        function formatCharacter(character) {
            const separator = character.indexOf('-');
            if (separator === -1) return character;
            const name = character.slice(0, separator);
            const realm = character.slice(separator + 1).split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
            return name + '-' + realm;
        }

        function element(tag, className, text) {
            const node = document.createElement(tag);
            node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function renderActivities() {
            const { rows, invalidLines } = parseActivities(input.value);
            const fragment = document.createDocumentFragment();
            rows.forEach(row => {
                const tr = document.createElement('tr');
                const characterCell = document.createElement('td');
                const character = element('div', 'character');
                const name = element('span', 'name', formatCharacter(row.character));
                const characterClass = characterClassMap.get(row.character);
                const matchedColor = Object.hasOwn(classColorMap, characterClass) ? classColorMap[characterClass] : undefined;
                if (!matchedColor && !characterColors.has(row.character)) {
                    characterColors.set(row.character, classColors[Math.floor(Math.random() * classColors.length)]);
                }
                name.style.color = matchedColor || characterColors.get(row.character);
                name.title = name.textContent;
                character.append(name);
                characterCell.append(character);

                const ratingCell = document.createElement('td');
                const rating = element('div', 'pair');
                const changeClass = row.change > 0 ? 'up' : row.change < 0 ? 'down' : 'flat';
                const changeText = row.change > 0 ? '+' + row.change : String(row.change);
                rating.append(element('span', 'mono', row.rating), element('span', 'trend ' + changeClass, changeText));
                ratingCell.append(rating);

                const summaryCell = document.createElement('td');
                const summary = element('div', 'summary');
                const wins = element('span', 'up', row.wins);
                const losses = element('span', 'down', row.losses);
                wins.setAttribute('aria-label', '勝場 ' + row.wins);
                losses.setAttribute('aria-label', '敗場 ' + row.losses);
                summary.append(wins, element('span', '', '-'), losses);
                summaryCell.append(summary);

                const updated = element('td', 'updated', lastUpdatedHours + ' hours');
                tr.append(characterCell, ratingCell, summaryCell, updated);
                fragment.append(tr);
            });
            tableBody.replaceChildren(fragment);
            status.textContent = '已顯示 ' + rows.length + ' 筆資料' + (invalidLines.length ? '；第 ' + invalidLines.join('、') + ' 行格式不符，請檢查。' : '。');
        }

        input.addEventListener('input', renderActivities);
        renderActivities();
    </script>
